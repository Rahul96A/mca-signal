# Full stack: Next.js app + PostgreSQL (pg_trgm) + Redis cache + background sync worker.
#   cp .env.example .env   # optional: add DATA_GOV_API_KEY etc. Leave empty for demo mode.
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mca
      POSTGRES_PASSWORD: mca
      POSTGRES_DB: mca_signal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mca -d mca_signal"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mca:mca@postgres:5432/mca_signal
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string-of-at-least-32-chars}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mca:mca@postgres:5432/mca_signal
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string-of-at-least-32-chars}
      WORKER_INTERVAL_MINUTES: ${WORKER_INTERVAL_MINUTES:-360}
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
